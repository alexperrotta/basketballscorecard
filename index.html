<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
    </head>
<body>
    <div class="main-container">
        
        <div class="team-wrapper">
            <h3>HOME</h3>
            <div class="score-box">
                <div id="home-score-el" class="score-text">0</div>
            </div>
            <div class="btn-container">
                <button id="home-add-1">+1</button>
                <button id="home-add-2">+2</button>
                <button id="home-add-3">+3</button>
            </div>
        </div>

        <div class="team-wrapper">
            <h3>GUEST</h3>
            <div class="score-box">
                <div id="guest-score-el" class="score-text">0</div>
            </div>
            <div class="btn-container">
                <button id="guest-add-1">+1</button>
                <button id="guest-add-2">+2</button>
                <button id="guest-add-3">+3</button>
            </div>
        </div>
        
    </div>

    <button id="reset-btn">NEW GAME</button>

    <script src="index.js"></script>
</body>
</html>
